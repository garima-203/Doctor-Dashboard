<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Option Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      color: white;
    }
    .option-card {
      /* backdrop-filter: blur(15px); */
      background: rgba(20, 20, 30, 0.6);
      border-radius: 20px;
      padding: 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
   
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .option-card:hover {
      transform: translateY(-8px) scale(1.02);
    }
    .option-icon {
      font-size: 3rem;
      margin-bottom: 1.2rem;
      animation: floatIcon 3s ease-in-out infinite;
    }
    .patient-icon { color: #00ff99; }
    .doctor-icon { color: #00ccff; }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .option-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .option-desc {
      font-size: 1rem;
      color: rgba(255,255,255,0.85);
      margin-bottom: 1.8rem;
    }
    .btn-custom {
      border-radius: 30px;
      padding: 0.6rem 1.5rem; 
      font-weight: 500;
      font-size: 0.95rem;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-patient {
      background: linear-gradient(135deg, #00ff99, #00cc66);
      color: black; 
    }
    .btn-doctor {
      background: linear-gradient(135deg, #00ccff, #0066ff);
      color: rgb(12, 12, 12);
    }
    .btn-custom:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="justify-content-center row g-4">

      <!-- Patient Form Card -->
      <div class="col-md-5">
        <div class="option-card">
          <div class="option-icon patient-icon"><i class="fas fa-user-plus"></i></div>
          <div class="option-title">Patient Form</div>
          <div class="option-desc">Fill in your details and start your journey to better health.</div>
          <a href="./src/patients-form/patientsForm.html" class="btn btn-custom btn-patient">Open Form</a>
        </div>
      </div>

      <!-- Doctor Dashboard Card -->
      <div class="col-md-5">
        <div class="option-card">
          <div class="option-icon doctor-icon"><i class="fas fa-user-md"></i></div>
          <div class="option-title">Doctor's Dashboard</div>
          <div class="option-desc">Manage appointments, view patients & streamline your work.</div>
          <a href="./src/doctor-dashboard/dashboardMain.html" class="btn btn-custom btn-doctor">Go to Dashboard</a> 
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
